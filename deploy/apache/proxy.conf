# Installed to /etc/apache2/thereish.app.d/proxy.conf and included by both
# the :80 vhost and the :443 one certbot generates from it. Re-run
# bin/provision-server to apply a change here.

ProxyPreserveHost On

# config/prod.exs turns on force_ssl with rewrite_on: [:x_forwarded_proto].
# Apache terminates TLS and proxies onward in plain HTTP, so without this header
# the app believes every request is insecure and 301s to the URL it is already
# on — a redirect loop. `expr=%{REQUEST_SCHEME}` tells it the truth in each
# vhost rather than hardcoding https into a file that also serves port 80.
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

# Keep the deployment unindexed until the game is meant to be found.
Header always set X-Robots-Tag "noindex, nofollow"

# Canonicalize www to apex over HTTPS
RewriteEngine On
RewriteCond %{HTTP_HOST} ^www\.thereish\.app$ [NC]
RewriteRule ^ https://thereish.app%{REQUEST_URI} [END,NE,R=permanent]

# `upgrade=websocket` is what carries LiveView's socket; without it the socket
# silently falls back to long polling, which is exactly the latency the
# couch-night hosting decision exists to measure honestly. Apache 2.4.47+.
ProxyPass        / http://127.0.0.1:3530/ upgrade=websocket
ProxyPassReverse / http://127.0.0.1:3530/

# Apache vhost for meld.stephens.page, installed by bin/provision-server.
# certbot --apache adds the :443 vhost and the HTTP->HTTPS redirect from this
# one, so the ProxyPass below is what ends up serving TLS traffic too.
#
# This follows ~/infra/ansible/roles/new_subdomain's proxy template, with one
# addition that template does not have: `upgrade=websocket`, without which
# LiveView's socket never leaves long-polling. Apache 2.4.47+ is required for it
# (the VPS runs 2.4.58).
<VirtualHost *:80>
    ServerName meld.stephens.page

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3530/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3530/

    ErrorLog ${APACHE_LOG_DIR}/meld.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/meld.stephens.page-access.log combined
</VirtualHost>

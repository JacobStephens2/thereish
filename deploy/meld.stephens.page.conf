# Apache vhost for meld.stephens.page, installed by deploy/provision.sh.
#
# Deliberately thin. certbot --apache copies this file to build the :443 vhost
# and adds the HTTP->HTTPS redirect, so anything written inline here would exist
# in two places that drift. Everything that can change lives in the included
# fragment instead (deploy/apache/proxy.conf), which both vhosts then share —
# the same pattern as the apex stephens.page vhost's stephens.page.d directory.
<VirtualHost *:80>
    ServerName meld.stephens.page

    IncludeOptional /etc/apache2/meld.stephens.page.d/*.conf

    ErrorLog ${APACHE_LOG_DIR}/meld.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/meld.stephens.page-access.log combined
</VirtualHost>

# The Scribe's prose gate (design law 14, ADR-0009).
#
# Everything here is read by `MeaningGame.Steward.Vale`, which runs one recap
# through the `vale` binary as Markdown. Nothing else in the codebase shells
# out.
#
# The packages are vendored under `styles/` rather than fetched with `vale
# sync`, so the gate works on a laptop with no network and inside a release
# image that never had one. Re-sync them with `mix scribe.sync`.
StylesPath = styles

# Warning and above is what the gate refuses. The packages put their strongest
# opinions at `error` and their tics at `suggestion`; warning is the line
# between prose a reader would wince at and prose a style guide merely has a
# view about.
MinAlertLevel = warning

Packages = proselint, write-good, AiTells

[*.md]
BasedOnStyles = Scribe, proselint, write-good, AiTells

# The one rule that fires on the job rather than on a fault. A recap says what
# the anchors handed the players and what the Assayer called it, and write-good
# reads every one of those as passive voice. AiTells keeps a quieter passive
# rule at suggestion level, which is where this opinion belongs.
write-good.Passive = NO

# write-good's wordiness list is mostly worth heeding and partly "it is" and "it
# was", which fire on ordinary narration and cost a repair pass that would
# otherwise have gone on the length. proselint keeps the useful half of this
# opinion (`proselint.Needless`, `proselint.Airlinese`) without the two-word
# hits.
write-good.TooWordy = NO
